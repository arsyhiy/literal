[project]
name = "literal"
version = "0.01"
description = "book and tabletop games store (portfolio project) using django"
authors = [
    {name = "arsyhiy",email = "arsyhiy32@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django (>=6.0.5,<7.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "black (>=26.5.1,<27.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.black]
target-version = ["py313"]
